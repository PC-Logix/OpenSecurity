plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

group = mod_group_id

// GitHub tags are the canonical release versions. Development builds retain
// the release line and append their CI or local build number.
def githubTag = System.getenv('GITHUB_REF_TYPE') == 'tag'
        ? System.getenv('GITHUB_REF_NAME')?.replaceFirst(/^v/, '')
        : null

def ciBuildNumber = findProperty('build_number') ?:
        System.getenv('BUILD_NUMBER') ?:
        System.getenv('GITHUB_RUN_NUMBER') ?:
        'local'

version = githubTag ?: "${mod_version}-dev.${ciBuildNumber}"

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    mods {
        opensecurity {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer { type = 'gameTestServer' }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }
}

sourceSets {
    main {
        java.setSrcDirs(['src/main/java'])
        resources.setSrcDirs(['src/main/resources', 'src/generated/resources', 'src/main/templates'])
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.michiyo.me/releases/' }
    maven { url = 'https://maven.kotori316.com' }
}

dependencies {
    compileOnly "li.cil.oc:opencomputers:${opencomputers_version}"
    runtimeOnly "li.cil.oc:opencomputers:${opencomputers_version}"
    runtimeOnly "com.kotori316:scalablecatsforce-neoforge:${scala_loader_version}:with-library"
    implementation 'org.mindrot:jbcrypt:0.4'
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: project.version,
            mod_license: mod_license,
            mod_authors: mod_authors,
            mod_description: mod_description,
            minecraft_version_range: minecraft_version_range,
            neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            opencomputers_version_range: opencomputers_version_range
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') { into 'META-INF' }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
}
